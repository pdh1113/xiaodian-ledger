<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="离线小店收支记录工具：记录收入支出、查看本月结余、导出CSV。不注册，数据保存在当前浏览器。">
<title>小店账本｜轻量收支记录</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#172521;--muted:#718078;--line:#e3eae5;--green:#17664f;--mint:#e8f3ed;--red:#bd4c40;--shadow:0 10px 35px #193d2a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}.shell{max-width:1080px;margin:auto;padding:30px 22px 54px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.logo{font-size:20px;font-weight:800;letter-spacing:-.04em}.logo span{color:var(--green)}.badge{font-size:12px;color:var(--green);background:var(--mint);padding:7px 12px;border-radius:99px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.intro h1{font-size:34px;letter-spacing:-.05em;margin:0}.intro p{margin:7px 0 0;color:var(--muted)}.month{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:19px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:4px;letter-spacing:-.03em}.in{color:var(--green)}.out{color:var(--red)}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 15px}.form{display:grid;gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:8px;padding:10px 11px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#7eaf98;box-shadow:0 0 0 3px #17664f12}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:8px;background:var(--green);color:#fff;padding:11px 15px;font-weight:750;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.light{background:#edf3ef;color:var(--ink)}.btn.danger{background:#fff2f0;color:var(--red)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.toolbar h2{margin:0}.tools{display:flex;gap:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:510px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:700}td.amount{text-align:right;font-weight:750;white-space:nowrap}.amount.plus{color:var(--green)}.amount.minus{color:var(--red)}td.action{text-align:right}.empty{text-align:center;color:var(--muted);padding:38px 10px}.del{border:0;background:none;color:#9a6b65;cursor:pointer;font-size:12px}.privacy{margin-top:15px;color:var(--muted);font-size:12px}.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#173b2f;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:760px){.shell{padding:20px 14px 36px}.top{margin-bottom:24px}.intro{align-items:start;flex-direction:column}.intro h1{font-size:29px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:19px}.stat small{font-size:11px}.layout{grid-template-columns:1fr}.panel{padding:16px}.toolbar{align-items:start;flex-direction:column}}
</style></head>
<body><main class="shell"><header class="top"><div class="logo">小店<span>账本</span></div><span class="badge">离线可用 · 无需注册</span></header>
<section class="intro"><div><h1>今天的收支，记清楚。</h1><p>记录每一笔收入和支出，按月查看结余，需要时导出表格。</p></div><input class="month" type="month" id="month"></section>
<section class="stats"><article class="stat"><small>本月收入</small><strong class="in" id="income">¥0.00</strong></article><article class="stat"><small>本月支出</small><strong class="out" id="expense">¥0.00</strong></article><article class="stat"><small>本月结余</small><strong id="balance">¥0.00</strong></article></section>
<div class="layout"><section class="panel"><h2>记一笔</h2><form class="form" id="entryForm"><div class="row"><div class="field"><label for="kind">收支类型</label><select id="kind"><option value="income">收入</option><option value="expense">支出</option></select></div><div class="field"><label for="date">日期</label><input id="date" type="date" required></div></div><div class="field"><label for="title">项目名称</label><input id="title" maxlength="40" placeholder="例如：午市营业额" required></div><div class="row"><div class="field"><label for="category">分类</label><select id="category"><option>营业收入</option><option>商品采购</option><option>房租水电</option><option>人工费用</option><option>平台费用</option><option>其他</option></select></div><div class="field"><label for="amount">金额（元）</label><input id="amount" type="number" min="0.01" max="99999999" step="0.01" placeholder="0.00" required></div></div><button class="btn" type="submit">保存记录</button></form><p class="privacy">记录仅保存在当前浏览器。清除浏览器数据前，请先导出备份。</p></section>
<section class="panel"><div class="toolbar"><h2>收支明细</h2><div class="tools"><button class="btn light" id="export">导出 CSV</button><button class="btn danger" id="clear">清空记录</button></div></div><div class="tablewrap"><table><thead><tr><th>日期</th><th>项目</th><th>分类</th><th style="text-align:right">金额</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">这个月还没有记录，添加第一笔试试。</div></div></section></div><footer class="foot">小店账本 · 简单记录与汇总工具，不替代会计或税务软件</footer></main><div class="toast" id="toast"></div>
<script>
(()=>{const KEY='xiaodian-ledger-v1';const $=id=>document.getElementById(id);let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{entries=[]}const today=new Date();const localDate=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').value=localDate;$('month').value=localDate.slice(0,7);const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});function save(){localStorage.setItem(KEY,JSON.stringify(entries));render()}function render(){const month=$('month').value;const list=entries.filter(x=>x.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);let inc=0,exp=0;for(const x of list){if(x.kind==='income')inc+=x.amount;else exp+=x.amount}$('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(inc-exp);$('balance').className=inc-exp<0?'out':'';$('rows').innerHTML='';$('empty').style.display=list.length?'none':'block';for(const x of list){const tr=document.createElement('tr');const fields=[x.date,x.title,x.category];for(const value of fields){const td=document.createElement('td');td.textContent=value;tr.append(td)}const amount=document.createElement('td');amount.className='amount '+(x.kind==='income'?'plus':'minus');amount.textContent=(x.kind==='income'?'+':'−')+money(x.amount);tr.append(amount);const action=document.createElement('td');action.className='action';const del=document.createElement('button');del.className='del';del.textContent='删除';del.setAttribute('aria-label','删除'+x.title);del.onclick=()=>{entries=entries.filter(e=>e.id!==x.id);save()};action.append(del);tr.append(action);$('rows').append(tr)}}$('month').addEventListener('change',render);$('entryForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),kind:$('kind').value,date:$('date').value,title:$('title').value.trim(),category:$('category').value,amount,created:Date.now()});save();$('title').value='';$('amount').value='';toast('已保存')});$('export').onclick=()=>{const list=entries.filter(x=>x.date.slice(0,7)===$('month').value).sort((a,b)=>a.date.localeCompare(b.date));if(!list.length){toast('当前月份没有记录');return}const q=s=>'"'+String(s).replaceAll('"','""')+'"';const csv='日期,类型,项目,分类,金额\r\n'+list.map(x=>[x.date,x.kind==='income'?'收入':'支出',x.title,x.category,x.amount.toFixed(2)].map(q).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='小店账本-'+$('month').value+'.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV 已导出')};$('clear').onclick=()=>{if(!entries.length)return toast('当前没有记录');if(confirm('确定删除全部记录吗？此操作无法撤销。建议先导出 CSV 备份。')){entries=[];save();toast('记录已清空')}};function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}render()})();
</script></body></html>
